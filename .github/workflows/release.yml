name: Release

# Release-as-code (ADR-0015). Pushing a `vX.Y.Z` tag is the human release
# decision; this workflow does the mechanical ceremony and — critically —
# GATES it, turning the "cut a git tag at each CHANGELOG version" convention
# (ADR-0013) into a structural check rather than a discipline-only promise.
#
# On a `v*` tag push it:
#   1. Validates the tag against the CHANGELOG (the gate): the version must
#      have a dated `## [X.Y.Z] — YYYY-MM-DD` section AND [Unreleased] must
#      be empty at the tagged commit. Mismatch → the run fails, no release.
#   2. Extracts that version's CHANGELOG section as the release body.
#   3. Assembles a curated template archive (the tagged tree minus the
#      exclusion list) so "download the latest release" is the clean-start
#      adoption path.
#   4. Creates the GitHub release with the archive attached.
#
# Same stance as branch-protection-as-code (ADR-0005): human triggers,
# machine executes and validates. Fully-automatic release-on-merge was
# rejected — see ADR-0015.

on:
  push:
    tags:
      - 'v*'

# First seed workflow needing more than read: it creates releases and
# uploads assets. Scoped to contents and justified by running only on tag
# pushes (never on arbitrary `main` pushes).
permissions:
  contents: write

env:
  # The changelog the gate reads. The seed keeps its own history under
  # meta/; an adopter flips this to their root CHANGELOG.md.
  CHANGELOG_PATH: meta/CHANGELOG.md
  # Paths excluded from the curated template archive (space-separated,
  # repo-root-relative). Default: seed-meta only — see ADR-0015 for why
  # scripts/, .github/, and .claude/ stay in. `.git` never appears in a
  # `git archive` stream, so it needs no entry here. Adopters adapt this.
  ARCHIVE_EXCLUDES: meta

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag ↔ CHANGELOG (the gate)
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/release_changelog.py validate \
            --changelog "$CHANGELOG_PATH" --version "$version"

      - name: Extract release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/release_changelog.py extract \
            --changelog "$CHANGELOG_PATH" --version "$version" > release-notes.md
          # Single-quoted heredoc: literal text (the markdown backticks
          # never trigger shell expansion). Body and terminator sit at the
          # block-scalar indent so YAML dedents them uniformly.
          cat >> release-notes.md <<'EOF'

          ---

          **Adopting?** Download the `*-template.zip` / `*-template.tar.gz` asset below — it is the tagged tree with seed-meta pre-stripped, the clean-start starting point in the README (§"How to adopt"). The auto-generated "Source code" archives are the everything-included variant.
          EOF

      # Assembly and publish share one step so the archive names never
      # cross a step boundary (no `$GITHUB_ENV` hand-off for shellcheck to
      # flag as unassigned).
      - name: Assemble template archive and create release
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
          # Target the repo explicitly (docs/CONTRIBUTING.md §"`gh` CLI in
          # workflows") — gh must not infer it from the checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          name="${REPO_NAME}-${GITHUB_REF_NAME}-template"
          mkdir "$name"
          # `git archive HEAD` = the tagged commit's tracked tree (no .git,
          # no untracked files). Extract it, then drop the exclusion list.
          git archive HEAD | tar -x -C "$name"
          read -ra excludes <<< "$ARCHIVE_EXCLUDES"
          for path in "${excludes[@]}"; do
            rm -rf "${name:?}/${path}"
          done
          zip -qr "${name}.zip" "$name"
          tar -czf "${name}.tar.gz" "$name"
          # Re-run recovery: `gh release create` errors if the release
          # already exists, so a partial run (release created but an asset
          # upload died) does NOT self-heal on re-run — delete the partial
          # release (or re-push the tag) first, then re-run. ADR-0015 leaves
          # workflow_dispatch open as a future re-run convenience.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${name}.zip" "${name}.tar.gz"
